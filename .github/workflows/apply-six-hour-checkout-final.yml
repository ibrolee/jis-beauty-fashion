name: Apply verified six-hour checkout patch
on:
  push:
    paths:
      - '.github/workflows/apply-six-hour-checkout-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audited source patch with corrected catalog guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/apply-bank-transfer-reservation-fix.yml').read_text()
          start=workflow.index('          from pathlib import Path\n')
          end=workflow.index('          PY\n',start)
          source=textwrap.dedent(workflow[start:end])
          lines=source.splitlines()
          matches=[i for i,line in enumerate(lines) if line.startswith("p=Path(path); s=p.read_text(); target='  await ensureSeeded();")]
          assert len(matches)==1, 'Expected exactly one original catalog guard'
          i=matches[0]
          assert 's.count(target)==2' in lines[i] and 's.replace(target' in lines[i+1]
          lines[i:i+2]=[
            'p=Path(path); s=p.read_text()',
            'for target in ("export async function getProducts(filters: ProductFilters = {}): Promise<PaginatedProducts> {\\n  await ensureSeeded();\\n", "export async function getProductBySlug(slug: string): Promise<ProductDetail | null> {\\n  await ensureSeeded();\\n"):',
            '    assert s.count(target)==1, "Catalog source changed unexpectedly"',
            '    s=s.replace(target,target+"  await expireUnpaidBankTransfers();\\n")',
            'p.write_text(s)',
          ]
          exec(compile('\n'.join(lines)+'\n','guarded-checkout-migration','exec'))
          PY
          git diff --check
          git diff --stat
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Commit checked source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/actions/admin.ts src/lib/actions/checkout.ts src/lib/data/products.ts src/lib/data/orders.ts src/components/admin/order-status-form.tsx src/components/checkout/checkout-form.tsx 'src/app/(store)/order/[orderNumber]/page.tsx' src/content/policies.ts
          git commit -m 'Enforce six-hour transfers and race-safe inventory and admin updates'
          git push
