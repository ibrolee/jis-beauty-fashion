name: JIS prelaunch audit
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'next.config.ts'
      - 'vercel.json'
      - 'package.json'
      - '.github/workflows/prelaunch-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
  public-site:
    runs-on: ubuntu-latest
    steps:
      - name: Public pages, assets, six-hour terms, and cron authorization (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,html,sys
          base='https://jis-beauty-fashion.vercel.app'
          pages=['/','/shop','/categories','/about','/contact','/faq','/shipping','/returns','/privacy','/terms','/cart','/checkout','/robots.txt','/sitemap.xml',
                  '/product/dove-go-fresh-antiperspirant-spray','/product/incidence-paris-100ml','/product/riggs-body-spray','/product/genies-collection-parfums']
          failures=[]
          def get(url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'JIS-prelaunch-audit/1.0'})
              with urllib.request.urlopen(req,timeout=25) as response:
                return response.status,response.headers.get('Content-Type',''),response.read()
            except urllib.error.HTTPError as exc:
              return exc.code,exc.headers.get('Content-Type',''),exc.read()[:200]
            except Exception as exc:
              return 0,str(exc),b''
          for path in pages:
            status,ctype,body=get(base+path)
            print('PAGE',status,path,len(body),flush=True)
            if status!=200:failures.append('Page '+path+' status '+str(status))
            if path=='/' and status==200 and 'localhost:3000' in html.unescape(body.decode('utf-8','replace')):
              failures.append('Homepage contains localhost metadata')
          files=['dove-apple-white-tea-v2.jpg','dove-cucumber-green-tea-v2.jpg','dove-grapefruit-lemongrass-v2.jpg','incidence-paris-100ml-hero.jpg','riggs-rider.webp','riggs-chief.webp','riggs-armour.webp','riggs-power.webp']
          for filename in files:
            status,ctype,body=get(base+'/catalog/'+filename)
            print('IMAGE',status,ctype,filename,len(body),flush=True)
            if status!=200 or not ctype.startswith('image/'):failures.append('Product image '+filename+' unavailable')
          sha='7368e43e3c0edd84013e6b514bc5e77e97a0952b'
          for filename in ('genie-merlot.webp','genie-midnight-exclusive.webp'):
            url=f'https://raw.githubusercontent.com/ibrolee/jis-beauty-fashion/{sha}/public/catalog/{filename}'
            source,stype,_=get(url)
            optimized,otype,_=get(base+'/_next/image?url='+urllib.parse.quote(url,safe='')+'&w=640&q=75')
            print('GENIE',filename,source,stype,optimized,otype,flush=True)
            if source!=200 or optimized!=200 or not otype.startswith('image/'):failures.append('Genie image '+filename+' unavailable')
          status,ctype,body=get(base+'/contact')
          text=html.unescape(body.decode('utf-8','replace'))
          print('DEPLOYMENT_CONTACT_NEW_COPY', 'Questions about an order or a fragrance?' in text,flush=True)
          print('DEPLOYMENT_CONTACT_OLD_EMAIL', 'hello@jisbeauty.ng' in text,flush=True)
          # Separate live deployment checks from source lint: the site should not
          # be announced while the previous 24-hour policy is still deployed.
          for path,needle in [('/terms','six hours'),('/faq','Six hours')]:
            code,_,body=get(base+path)
            found=needle.lower() in html.unescape(body.decode('utf-8','replace')).lower()
            print('LIVE_SIX_HOUR_POLICY',path,code,found,flush=True)
            if code!=200 or not found: failures.append('Six-hour policy not deployed on '+path)
          code,_,_=get(base+'/api/cron/expire-bank-transfers')
          print('CRON_UNAUTHENTICATED',code,flush=True)
          if code!=401: failures.append('Cron auth check expected 401, got '+str(code))
          print('SMOKE_TEST', 'PASS' if not failures else 'FAIL',len(pages),'pages',len(files)+2,'product images',flush=True)
          for failure in failures:print('ISSUE',failure,flush=True)
          sys.exit(bool(failures))
          PY
