name: Repair checkout migration guard
on:
  push:
    paths:
      - '.github/workflows/retry-bank-transfer-patch.yml'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct the catalog guard and retrigger verified patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-bank-transfer-reservation-fix.yml')
          s=p.read_text()
          old="          p=Path(path); s=p.read_text(); target='  await ensureSeeded();\\n'; assert s.count(target)==2\n          p.write_text(s.replace(target,target+'  await expireUnpaidBankTransfers();\\n'))"
          new="          p=Path(path); s=p.read_text()\n          for target in ('export async function getProducts(filters: ProductFilters = {}): Promise<PaginatedProducts> {\\n  await ensureSeeded();\\n', 'export async function getProductBySlug(slug: string): Promise<ProductDetail | null> {\\n  await ensureSeeded();\\n'):\n              assert s.count(target)==1, 'Catalog source changed unexpectedly'\n              s=s.replace(target,target+'  await expireUnpaidBankTransfers();\\n')\n          p.write_text(s)"
          assert s.count(old)==1, 'Original guard changed; do not overwrite'
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+ibrolee@users.noreply.github.com'
          git add .github/workflows/apply-bank-transfer-reservation-fix.yml
          git commit -m 'Scope inventory expiry hook to catalog and product detail requests'
          git push
