name: Fix catalog variant photo validation
on:
  push:
    paths:
      - .github/workflows/fix-variant-layout-and-editor.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow existing catalog photos in variant editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/actions/admin.ts')
          text = p.read_text()
          old = 'u.startsWith("/images/")'
          new = '(u.startsWith("/images/") || u.startsWith("/catalog/"))'
          if text.count(old) != 1:
              raise RuntimeError('Unexpected photo validation; refusing unsafe edit')
          p.write_text(text.replace(old, new, 1))
          assert 'u.startsWith("/catalog/")' in p.read_text()
          for name in ['dove-apple-white-tea-v2.jpg', 'dove-cucumber-green-tea-v2.jpg', 'dove-grapefruit-lemongrass-v2.jpg']:
              assert (Path('public/catalog') / name).is_file(), name
          print('PASS: catalog photos are accepted and all three existing Dove images are present')
          PY
          git diff --check
      - name: Commit fix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/actions/admin.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Accept existing catalog photos when editing Dove variants'
            git push
          fi