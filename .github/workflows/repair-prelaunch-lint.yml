name: Repair prelaunch customer messages
on:
  push:
    paths:
      - '.github/workflows/repair-prelaunch-lint.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fix inaccurate messages without changing business policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path,replacements):
            p=Path(path); text=p.read_text()
            for old,new in replacements:
              assert text.count(old)==1,(path,'unexpected text',old[:85],text.count(old))
              text=text.replace(old,new)
            p.write_text(text)
          patch('src/app/(store)/order/[orderNumber]/page.tsx',[("A confirmation has been sent to ${order.email}.","You can check the order details and status below."),("Our account details will be sent to you on WhatsApp and by email within a few minutes. You can also message us directly to receive them instantly.","Our bank details are not available on this page yet. Please request and verify them with us on WhatsApp before making a transfer.")])
          for path in ('returns','privacy','terms'):
            patch(f'src/app/(store)/{path}/page.tsx', [(' updated="January 2025"','')])
          patch('src/lib/actions/engagement.ts',[("Message received — we'll reply within one business day.","Message received. Please contact us on WhatsApp if your request is urgent.")])
          PY
          git diff --check
          git diff --stat
      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+ibrolee@users.noreply.github.com'
          git add 'src/app/(store)/order/[orderNumber]/page.tsx' 'src/app/(store)/returns/page.tsx' 'src/app/(store)/privacy/page.tsx' 'src/app/(store)/terms/page.tsx' src/lib/actions/engagement.ts
          git commit -m 'Correct unverified email and support promises; remove stale policy dates'
          git push
