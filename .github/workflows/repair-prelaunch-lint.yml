name: Repair prelaunch lint issues
on:
  push:
    paths:
      - '.github/workflows/repair-prelaunch-lint.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply guarded minimal source patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/(store)/contact/page.tsx')
          data=p.read_text()
          old="we'll get back to you as soon as possible."
          assert data.count(old)==1, 'Contact text changed unexpectedly'
          p.write_text(data.replace(old,'we’ll get back to you as soon as possible.'))
          p=Path('src/components/layout/mobile-menu.tsx')
          data=p.read_text()
          replacements={
            'import { usePathname } from "next/navigation";\n':'',
            '  const [mounted, setMounted] = useState(false);\n  const pathname = usePathname();\n\n  useEffect(() => {\n    setMounted(true);\n  }, []);\n\n':'',
            '  useEffect(() => {\n    setOpen(false);\n  }, [pathname]);\n\n':'',
            '{mounted && open\n        ? createPortal(drawer, document.body)\n        : null}':'{open && typeof document !== "undefined"\n        ? createPortal(drawer, document.body)\n        : null}',
          }
          for old,new in replacements.items():
            assert data.count(old)==1, 'Mobile navigation source changed unexpectedly: '+old[:60]
            data=data.replace(old,new)
          p.write_text(data)
          PY
          git diff --check
          git diff --stat
      - name: Commit verified source patches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(store)/contact/page.tsx' src/components/layout/mobile-menu.tsx
          git commit -m 'Resolve contact JSX lint and mobile navigation state warnings'
          git push
