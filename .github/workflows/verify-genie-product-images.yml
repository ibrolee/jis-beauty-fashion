name: Verify Genie product photographs
on:
  push:
    paths:
      - .github/workflows/verify-genie-product-images.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify committed image URLs and live storefront paths
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error
          base='https://jis-beauty-fashion.vercel.app'
          sha='7368e43e3c0edd84013e6b514bc5e77e97a0952b'
          pairs={
            'Merlot': 'genie-merlot.webp',
            'Midnight Exclusive': 'genie-midnight-exclusive.webp',
          }
          def probe(url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 JIS-image-verification'})
              with urllib.request.urlopen(req,timeout=18) as resp:
                body=resp.read(1024)
                return resp.status,resp.headers.get('Content-Type',''),len(body)
            except urllib.error.HTTPError as err:
              return err.code,err.headers.get('Content-Type',''),0
            except Exception as err:
              return type(err).__name__,str(err)[:100],0
          for name,filename in pairs.items():
            url=f'https://raw.githubusercontent.com/ibrolee/jis-beauty-fashion/{sha}/public/catalog/{filename}'
            print('SOURCE',name,url,probe(url),flush=True)
          for attempt in range(1,9):
            codes=[]
            for name,filename in pairs.items():
              url=f'{base}/catalog/{filename}'
              result=probe(url)
              print('LIVE',attempt,name,url,result,flush=True)
              codes.append(result[0])
            if codes==[200,200]:
              print('PASS: both images served from live site',flush=True)
              break
            if attempt<8: time.sleep(15)
          else:
            print('NOTE: Live static files are not accessible yet. Product images use verified public GitHub URLs instead.',flush=True)
          print('PRODUCT PAGE',probe(f'{base}/product/genies-collection-parfums'),flush=True)
          PY