name: Apply six-hour checkout fixes
on:
  push:
    paths:
      - '.github/workflows/apply-bank-transfer-reservation-fix.yml'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded checkout and policy changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, f'{path}: expected exactly one occurrence of {old[:80]!r}, got {s.count(old)}'
              p.write_text(s.replace(old, new))
          path='src/lib/actions/admin.ts'
          s=Path(path).read_text()
          anchor='import { refreshProductRating } from "@/lib/data/reviews";\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'import { cancelOrderAndRelease } from "@/lib/orders/reservations";\n')
          first='  const order = await db.query.orders.findFirst({ where: eq(orders.id, orderId), with: { items: true } });\n'
          last='  revalidatePath("/admin/orders");'
          assert s.count(first)==1 and s.count(last)==1
          i=s.index(first); j=s.index(last,i)
          new='''  const order = await db.query.orders.findFirst({ where: eq(orders.id, orderId) });
          if (!order) return { error: "Order not found." };
          const originalStatus = String(formData.get("originalStatus") ?? "");
          const originalPaymentStatus = String(formData.get("originalPaymentStatus") ?? "");
          if (order.status !== originalStatus || order.paymentStatus !== originalPaymentStatus) {
            return { error: "This order changed since you opened it. Refresh the page before saving." };
          }

          if (status === "cancelled" && order.status !== "cancelled") {
            const cancelled = await cancelOrderAndRelease(orderId, { paymentStatus, adminNotes });
            if (!cancelled) return { error: "Order already cancelled or updated. Refresh before saving." };
          } else {
            if (order.status === "cancelled" && status !== "cancelled") {
              return { error: "A cancelled order cannot be reopened because its stock has been released. Create a new order after checking inventory." };
            }
            const nextStatus = status === "pending" && paymentStatus === "paid" ? "payment_confirmed" : status;
            const updated = await db.transaction(async (tx) => {
              const [changed] = await tx.update(orders)
                .set({ status: nextStatus, paymentStatus, adminNotes, updatedAt: new Date() })
                .where(and(eq(orders.id, orderId), eq(orders.status, order.status), eq(orders.paymentStatus, order.paymentStatus)))
                .returning({ id: orders.id });
              if (!changed) return false;
              if (paymentStatus !== order.paymentStatus) {
                const latest = await tx.query.payments.findFirst({ where: eq(payments.orderId, orderId), orderBy: [desc(payments.createdAt)] });
                if (latest) await tx.update(payments).set({
                  status: paymentStatus,
                  paidAt: paymentStatus === "paid" ? new Date() : latest.paidAt,
                  updatedAt: new Date(),
                }).where(eq(payments.id, latest.id));
              }
              return true;
            });
            if (!updated) return { error: "This order changed while saving. Refresh and review its payment status." };
          }

          '''
          s=s[:i]+new+s[j:]
          Path(path).write_text(s)
          path='src/components/admin/order-status-form.tsx'
          replace_once(path,'<input type="hidden" name="orderId" value={order.id} />','<input type="hidden" name="orderId" value={order.id} />\n      <input type="hidden" name="originalStatus" value={order.status} />\n      <input type="hidden" name="originalPaymentStatus" value={order.paymentStatus} />')
          path='src/lib/actions/checkout.ts'
          replace_once(path,'import { getPaymentProvider, isOnlinePaymentEnabled, PaymentConfigurationError } from "@/lib/payments";','import { getPaymentProvider, isOnlinePaymentEnabled, PaymentConfigurationError } from "@/lib/payments";\nimport { expireUnpaidBankTransfers } from "@/lib/orders/reservations";')
          replace_once(path,'  const input = parsed.data;\n  const user = await getCurrentUser();','  const input = parsed.data;\n  // Release old unpaid bank-transfer reservations before checking live stock.\n  await expireUnpaidBankTransfers();\n  const user = await getCurrentUser();')
          path='src/lib/data/products.ts'
          replace_once(path,'import { PRODUCTS_PER_PAGE } from "@/lib/constants";','import { PRODUCTS_PER_PAGE } from "@/lib/constants";\nimport { expireUnpaidBankTransfers } from "@/lib/orders/reservations";')
          p=Path(path); s=p.read_text(); target='  await ensureSeeded();\n'; assert s.count(target)==2
          p.write_text(s.replace(target,target+'  await expireUnpaidBankTransfers();\n'))
          path='src/lib/data/orders.ts'
          replace_once(path,'import { orderItems, orders, products, users, type OrderStatus } from "@/db/schema";','import { orderItems, orders, products, users, type OrderStatus } from "@/db/schema";\nimport { expireUnpaidBankTransfers } from "@/lib/orders/reservations";')
          replace_once(path,'export async function getOrderByNumber(orderNumber: string) {\n  return','export async function getOrderByNumber(orderNumber: string) {\n  await expireUnpaidBankTransfers();\n  return')
          replace_once(path,'export async function getAllOrdersAdmin(status?: OrderStatus, limit = 100) {\n  return','export async function getAllOrdersAdmin(status?: OrderStatus, limit = 100) {\n  await expireUnpaidBankTransfers();\n  return')
          replace_once(path,'export async function getOrderByIdAdmin(id: number) {\n  return','export async function getOrderByIdAdmin(id: number) {\n  await expireUnpaidBankTransfers();\n  return')
          path='src/components/checkout/checkout-form.tsx'
          replace_once(path,'Your items are reserved for 24 hours.','Your items are reserved for 6 hours from order placement. Send proof promptly so we can verify your transfer.')
          path='src/app/(store)/order/[orderNumber]/page.tsx'
          replace_once(path,'import { BANK_TRANSFER_DETAILS, isOnlinePaymentEnabled } from "@/lib/payments";','import { BANK_TRANSFER_DETAILS, isOnlinePaymentEnabled } from "@/lib/payments";\nimport { bankTransferDeadline } from "@/lib/orders/reservations";')
          replace_once(path,'Your items are reserved for 24 hours.','Your items are reserved for six hours from order placement. Please transfer and send proof before the deadline.')
          replace_once(path,'            {(order.paymentMethod === "bank_transfer" || failed) && (','            {order.paymentMethod === "bank_transfer" && (\n              <p className="mt-3 text-sm font-medium text-ink">Payment deadline: {bankTransferDeadline(order.createdAt).toLocaleString("en-NG", { timeZone: "Africa/Lagos", dateStyle: "medium", timeStyle: "short" })} (Lagos time). If you have already transferred but we have not confirmed it, contact us on WhatsApp promptly.</p>\n            )}\n\n            {(order.paymentMethod === "bank_transfer" || failed) && (')
          path='src/content/policies.ts'
          replace_once(path,'Unpaid bank-transfer orders are held for 24 hours before stock is released.','Unpaid direct bank-transfer orders are reserved for six hours from order placement. Once the deadline passes, an unconfirmed order may be automatically cancelled and its items returned to stock. Send proof of payment promptly; if you transferred before the deadline but your order was cancelled before confirmation, contact us on WhatsApp for review. Never pay an already-cancelled order.')
          replace_once(path,'  { q: "What payment methods do you accept?", a: "The checkout page shows the payment options currently available for your order and delivery state, including direct bank transfer." },','  { q: "What payment methods do you accept?", a: "The checkout page shows the payment options currently available for your order and delivery state, including direct bank transfer." },\n  { q: "How long is my bank-transfer order reserved?", a: "Six hours from the time you place your order. Transfer and send proof promptly. If you already paid and your order was cancelled while we were verifying the transfer, contact us on WhatsApp; do not make a second transfer without speaking to us." },')
          print('Patched checkout, inventory, admin, storefront and policy files')
          PY
          git diff --check
          git diff --stat
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate lint
        run: npm run lint
      - name: Commit only verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/actions/admin.ts src/lib/actions/checkout.ts src/lib/data/products.ts src/lib/data/orders.ts src/components/admin/order-status-form.tsx src/components/checkout/checkout-form.tsx 'src/app/(store)/order/[orderNumber]/page.tsx' src/content/policies.ts
          git commit -m 'Enforce six-hour bank transfer reservation and race-safe order updates'
          git push
