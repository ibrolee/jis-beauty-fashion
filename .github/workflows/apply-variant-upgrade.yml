name: Apply prepared variant upgrade
on:
  push:
    branches: [variants-image-upgrade]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and apply prepared patch
        shell: bash
        run: |
          set -euo pipefail
          for suffix in 00 01 02; do
            if [[ ! -f ".github/variant-upgrade.patch.b64.$suffix" ]]; then
              echo "Waiting for all patch parts"
              exit 0
            fi
          done
          cat .github/variant-upgrade.patch.b64.0{0,1,2} | base64 -d > /tmp/variant-upgrade.patch.bz2
          echo 'bbb49ba44e5e68b3f008f5750ab05df92e6a61489220399ba9c518af22f4967e  /tmp/variant-upgrade.patch.bz2' | sha256sum -c -
          bzip2 -dc /tmp/variant-upgrade.patch.bz2 > /tmp/variant-upgrade.patch
          echo '9a769a3fb065e1ce7b7a09b198ac48594a0e43bd1305f8a9776fa74c419e94f0  /tmp/variant-upgrade.patch' | sha256sum -c -
          rm migrations/001_variant_photos.sql
          patch --dry-run --batch --fuzz=1 -p1 < /tmp/variant-upgrade.patch
          patch --batch --fuzz=1 -p1 < /tmp/variant-upgrade.patch
          rm -f drizzle.config.json src/components/image-uploader.tsx.orig
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/variant-upgrade.patch.b64.0{0,1,2} .github/workflows/apply-variant-upgrade.yml
          git add -A
          git commit -m 'Apply complete variant image upgrade [skip ci]'
          git push origin HEAD:variants-image-upgrade
